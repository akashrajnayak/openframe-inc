    <script>
      // Defensive guard against third-party browser extension injection errors (e.g. MetaMask, wallet extensions)
      window.addEventListener('error', function(event) {
        var filename = event.filename || '';
        var msg = event.message || '';
        if (
          filename.indexOf('chrome-extension://') !== -1 ||
          filename.indexOf('@vite/client') !== -1 ||
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('inpage.js') !== -1 ||
          msg.indexOf('WebSocket closed without opened') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('WebSocket closed without opened') !== -1 ||
          stack.indexOf('chrome-extension://') !== -1 ||
          stack.indexOf('inpage.js') !== -1 ||
          stack.indexOf('@vite/client') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
