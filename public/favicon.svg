<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="16" fill="#FFFFFF"/>
  
  <!-- OpenFrame Geometric Corner Bracket -->
  <path d="M 46 29 L 46 16 L 14 16 L 14 76 L 30 76" 
        stroke="#0052FF" 
        stroke-width="7" 
        stroke-linejoin="miter" 
        stroke-linecap="square" 
        fill="none"/>

  <!-- OPEN in bold black -->
  <text x="24" y="47" 
        font-family="'Plus Jakarta Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="28" 
        letter-spacing="-1px" 
        fill="#000000">OPEN</text>

  <!-- Registered Trademark Sign (R) -->
  <circle cx="85" cy="33" r="5" stroke="#000000" stroke-width="1.2" fill="none"/>
  <text x="85" y="35.5" 
        font-family="-apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="6" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#000000">R</text>

  <!-- FRAME in royal corporate blue -->
  <text x="24" y="73" 
        font-family="'Plus Jakarta Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="28" 
        letter-spacing="-1px" 
        fill="#0052FF">FRAME</text>

  <!-- IT SOLUTIONS Private Limited -->
  <text x="24" y="86" 
        font-family="'Plus Jakarta Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="7" 
        font-weight="800" 
        fill="#000000" 
        letter-spacing="0.3px">IT SOLUTIONS <tspan font-weight="500" fill="#1E293B" font-size="6.5">Private Limited</tspan></text>
</svg>
